name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: forge test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vvv
      - name: Coverage
        run: forge coverage --report summary

  frontend:
    name: next typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Deployment configuration regressions
        run: npm test
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck

  services:
    name: signer/custodian typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Signer integration regressions
        run: npm test
      - name: Local-chain rotation and settlement rehearsal
        run: npm run test:chain
      - name: Actual deployment script and manifest preflight
        run: npm run test:deployment
