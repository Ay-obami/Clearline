name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: forge test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vvv
      - name: Coverage
        run: forge coverage --report summary

  frontend:
    name: next typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        run: npx tsc --noEmit

  services:
    name: signer/custodian typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Signer integration regressions
        run: npm test
